{% extends 'base.html' %}

{% block title %}
    {{ 'Editar Produto' if produto else 'Novo Produto' }} — MiniStore
{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 w-100 text-start">
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
        <h2 class="h4 mb-0 text-start">{{ 'Editar Produto' if produto else 'Novo Produto' }}</h2>
        <a href="{{ url_for('produtos.listar') }}" class="btn btn-outline-secondary btn-sm">Voltar</a>
    </div>

    <form method="POST" class="text-start">
        <!-- Código do Produto -->
        <div class="mb-3 text-start">
            <label for="codigo" class="form-label d-block text-start">Código do Produto <span class="text-danger">*</span></label>
            <input 
                type="text" 
                class="form-control text-start" 
                id="codigo" 
                name="codigo" 
                value="{{ produto.codigo if produto else '' }}" 
                placeholder="Ex: PROD01, 789123456"
                required
            >
        </div>

        <!-- Nome do Produto -->
        <div class="mb-3 text-start">
            <label for="nome" class="form-label d-block text-start">Nome do Produto <span class="text-danger">*</span></label>
            <input 
                type="text" 
                class="form-control text-start" 
                id="nome" 
                name="nome" 
                value="{{ produto.nome if produto else '' }}" 
                required
            >
        </div>

        <!-- Categoria -->
        <div class="mb-3 text-start">
            <label for="id_categoria" class="form-label d-block text-start">Categoria <span class="text-danger">*</span></label>
            <select class="form-select text-start" id="id_categoria" name="id_categoria" required>
                <option value="">Selecione uma categoria...</option>
                {% for cat in categorias %}
                <option value="{{ cat.id }}" {{ 'selected' if produto and produto.id_categoria == cat.id else '' }}>
                    {{ cat.nome }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Linha: Preço e Quantidade -->
        <div class="row text-start">
            <div class="col-md-6 mb-3 text-start">
                <label for="preco" class="form-label d-block text-start">Preço (R$) <span class="text-danger">*</span></label>
                <input 
                    type="number" 
                    step="0.01" 
                    class="form-control text-start" 
                    id="preco" 
                    name="preco" 
                    value="{{ produto.preco if produto else '' }}" 
                    required
                >
            </div>
            <div class="col-md-6 mb-3 text-start">
                <label for="quantidade" class="form-label d-block text-start">Quantidade em Estoque <span class="text-danger">*</span></label>
                <input 
                    type="number" 
                    class="form-control text-start" 
                    id="quantidade" 
                    name="quantidade" 
                    value="{{ produto.quantidade if produto else '' }}" 
                    required
                >
            </div>
        </div>

        <!-- Botões -->
        <div class="d-flex gap-2 mt-3 justify-content-start">
            <button type="submit" class="btn btn-primary">Salvar Produto</button>
            <a href="{{ url_for('produtos.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
